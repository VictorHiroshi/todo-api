services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # O host do banco é o nome do serviço: "db"
      DATABASE_URL: postgresql+asyncpg://todo:todo@db:5432/tododb
      APP_ENV: development
      DEBUG: "true"
      JWT_SECRET_KEY: a643bcdb3f61a07c3bf15db86aef9633a46d52189e8b25d3b1e6776e2564e241
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

volumes:
  pgdata: